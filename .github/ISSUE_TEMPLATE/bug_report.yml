name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands or MCP tool calls. Do NOT paste real secrets or private memory content.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: devmemory 0.1.0, Node 24.x, macOS 15, Claude Code 2.x
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `devmemory doctor --json`
